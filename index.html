<!DOCTYPE html>
<html lang="%VITE_APP_LANG%">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="%VITE_APP_FAVICON%" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>%VITE_APP_TITLE%</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif:ital,wght@0,400;0,600;1,400&family=Noto+Serif+SC:wght@400;600&family=Noto+Serif+TC:wght@400;600&display=swap" rel="stylesheet" />
    <style>
      /* App 启动页：与 generate-android-assets 文案/配色一致；仅原生壳显示 */
      html.is-native-app,
      html.is-native-app body {
        background: #f7f6f3;
      }

      #launch-splash {
        display: none;
        position: fixed;
        inset: 0;
        z-index: 99999;
        flex-direction: column;
        align-items: center;
        justify-content: flex-start;
        padding: 20vh 24px 0;
        box-sizing: border-box;
        background: #f7f6f3;
        color: #37352f;
        font-family: "Inter", "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans SC", sans-serif;
        -webkit-font-smoothing: antialiased;
        transition: opacity 280ms ease;
      }

      html.is-native-app #launch-splash {
        display: flex;
      }

      html.launch-splash-hiding #launch-splash {
        opacity: 0;
        pointer-events: none;
      }

      #launch-splash .launch-splash-icon {
        width: min(22vw, 96px);
        height: min(22vw, 96px);
        margin-bottom: 12vh;
      }

      #launch-splash .launch-splash-title {
        margin: 0;
        font-size: clamp(22px, 6.5vw, 34px);
        font-weight: 700;
        letter-spacing: 0.01em;
        text-align: center;
      }

      #launch-splash .launch-splash-tagline {
        margin: 0.55em 0 0;
        font-size: clamp(13px, 3.4vw, 16px);
        font-weight: 500;
        opacity: 0.72;
        text-align: center;
      }
    </style>
    <script>
      // Capacitor 在原生 WebView 会尽早注入；浏览器端不显示启动页
      (function () {
        try {
          if (window.Capacitor && typeof window.Capacitor.isNativePlatform === 'function' && window.Capacitor.isNativePlatform()) {
            document.documentElement.classList.add('is-native-app')
          }
        } catch (_) {}
      })()
    </script>
  </head>
  <body>
    <div id="launch-splash" aria-hidden="true">
      <svg class="launch-splash-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" aria-hidden="true">
        <path d="M8 52V13C8 11 10 9 12 9H31V52H8Z" stroke="#37352F" stroke-width="4" stroke-linejoin="round" />
        <path d="M56 52V13C56 11 54 9 52 9H33V52H56Z" stroke="#37352F" stroke-width="4" stroke-linejoin="round" />
        <path d="M33 9V52" stroke="#37352F" stroke-width="3.5" stroke-linecap="round" />
        <path d="M8 52H56" stroke="#37352F" stroke-width="4" stroke-linecap="round" />
        <path d="M19 25V37" stroke="#37352F" stroke-width="4" stroke-linecap="round" />
        <path d="M14 31H24" stroke="#37352F" stroke-width="4" stroke-linecap="round" />
      </svg>
      <p class="launch-splash-title">Bible Reader</p>
      <p class="launch-splash-tagline">向下扎根，向上结果</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
